name: Infra (plan / apply)

# Terraform dla konta Kowalewska Software WWW (298712672271): DNS, certyfikat,
# CloudFront, bucket strony. Push do main robi tylko plan; apply wyłącznie ręcznie,
# z wpisanym „deploy”.

on:
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]
  workflow_dispatch:
    inputs:
      akcja:
        description: plan albo apply
        type: choice
        options: [plan, apply]
        default: plan
      confirm:
        description: Przy apply wpisz „deploy”
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: infra-prod
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    # Rola AWS ufa wyłącznie tokenom z environmentu `prod` (repo jest publiczne).
    environment: prod
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Bramka apply
        if: github.event_name == 'workflow_dispatch' && inputs.akcja == 'apply' && inputs.confirm != 'deploy'
        run: |
          echo "::error::Apply wymaga wpisania „deploy” w polu confirm."
          exit 1

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.9

      - name: fmt
        run: terraform fmt -check -recursive

      - name: init
        run: terraform init -input=false -backend-config=prod.s3.tfbackend

      - name: validate
        run: terraform validate

      - name: plan
        run: terraform plan -input=false -lock-timeout=120s -out=tfplan

      - name: apply
        if: github.event_name == 'workflow_dispatch' && inputs.akcja == 'apply' && inputs.confirm == 'deploy'
        run: terraform apply -input=false tfplan

      - name: Wyniki
        if: github.event_name == 'workflow_dispatch' && inputs.akcja == 'apply' && inputs.confirm == 'deploy'
        run: terraform output
